    #loading::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(0deg, #241e28 0%, #241e28ee 16%, #241e28b3 35%, transparent 75%); pointer-events: none; }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    #loading h1 { font-weight: 700; font-size: clamp(24px, 4vw, 42px); line-height: 1.12; text-shadow: 0 2px 14px #241e28; }
    #loading-status { font-weight: 500; }
    #loading progress { display: block; width: min(320px, 75vw); height: 7px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #ffdba0; background: #ffffff26; }
    #loading progress::-webkit-progress-bar { background: #ffffff26; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #ffdba0; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #ffdba0; border-radius: 20px; }
    #loading button { min-height: 44px; border: 1px solid #ffdba0; border-radius: 10px; background: #241e28; color: #fff7eb; }
    #loading button:focus-visible { outline: 3px solid #ffdba0; outline-offset: 4px; }
    #loading [hidden] { display: none; }
    @media (max-aspect-ratio: 1/1) { #loading::before { background-size: 100% auto; } #loading::after { background: linear-gradient(180deg, transparent 25%, #241e28 100%) center top / 100% calc(100vw * 2 / 3) no-repeat; } #loading { place-content: center; padding-top: calc(100vw * 2 / 3); padding-bottom: max(24px, env(safe-area-inset-bottom)); } }
    @media (max-height: 480px) and (min-aspect-ratio: 1/1) { #loading { place-content: center end; padding: 16px 24px; } #loading > * { max-width: 44vw; } #loading h1 { font-size: clamp(20px, 4vw, 30px); } #loading::before { background-size: auto 100%; background-position: left center; } #loading::after { background: linear-gradient(90deg, transparent 0%, #241e2899 40%, #241e28 65%); } #loading progress { width: min(260px, 40vw); } }
  </style>
  <style id="snackisle-loading-style">
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff4ee; color: #684b55; font-family: "Noto Sans SC", sans-serif; }
    #canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; background: #fff4ee; outline: none; }
    #loading::before, #loading::after { content: none !important; background: none !important; }
    #loading { position: fixed; z-index: 2; inset: 0; box-sizing: border-box; display: grid; place-content: center; gap: 13px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #fff4ee; text-align: center; }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    #loading-icon { width: 96px; height: 96px; border-radius: 23px; box-shadow: 0 8px 22px #bd718533; }
    #loading h1 { margin: 0; color: #bd4f70; font-size: clamp(22px, 5vw, 36px); line-height: 1.25; text-shadow: none; overflow-wrap: anywhere; }
    #loading-status { margin: 0; font-size: 16px; font-weight: 700; }
    #loading progress { width: min(340px, 78vw); height: 10px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #e87391; background: #f2d4d8; }
    #loading progress::-webkit-progress-bar { background: #f2d4d8; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #e87391; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #e87391; border-radius: 20px; }
    #loading-details { margin: -5px 0 0; min-height: 1.5em; color: #78646a; font-size: 13px; font-variant-numeric: tabular-nums; }
    #loading-notice, #loading-hint { margin: 0; max-width: min(420px, 82vw); line-height: 1.6; }
    #loading-hint { color: #78646a; font-size: 13px; }
    #loading button, #pwa-install { min-height: 44px; border: 2px solid #d66a83; border-radius: 18px; background: #fffaf0; color: #734653; padding: 9px 20px; cursor: pointer; font: inherit; font-weight: 700; }
    #loading button:focus-visible, #pwa-install:focus-visible { outline: 3px solid #f3c766; outline-offset: 3px; }
    #pwa-install { position: fixed; z-index: 5; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); box-shadow: 0 3px 12px #55344433; }
    [hidden] { display: none !important; }
    @media (max-height: 480px) and (min-aspect-ratio: 1/1) { #loading { place-content: center; gap: 8px; padding: 12px 20px; } #loading-icon { width: 64px; height: 64px; } #loading h1 { font-size: clamp(20px, 4vw, 30px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  </style>

  <script>
    (() => {
      const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14116388,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
      const threads = false;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const details = document.getElementById('loading-details');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      const installButton = document.getElementById('pwa-install');
      document.getElementById('game-title').textContent = document.title;
      const zh = true;
      document.documentElement.lang = 'zh-TW';
      status.textContent = '正在載入點心島…';
      retry.textContent = '重新載入';
      progress.setAttribute('aria-label', '載入進度');
      retry.addEventListener('click', () => window.location.reload());
      let installPrompt = null;
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const isAppleTouch = /iPhone|iPad|iPod/i.test(navigator.userAgent) && !isStandalone;
      if (isAppleTouch) { installButton.hidden = false; installButton.textContent = '加入主畫面'; }
      window.addEventListener('beforeinstallprompt', (event) => { event.preventDefault(); installPrompt = event; installButton.hidden = false; });
      installButton.addEventListener('click', async () => {
        if (!installPrompt) { window.alert('請打開瀏覽器的分享或選單，選擇「加入主畫面」或「安裝應用程式」。'); return; }
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installButton.hidden = true;
      });
      window.addEventListener('appinstalled', () => { installButton.hidden = true; });
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? '目前沒有新的載入進度；可繼續等待，或重新載入。'
          : '仍在載入，可繼續等待。';

      const startupWatch = setInterval(updateNotice, 1000);

        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);

        if (failed || ready) return;

        stopObserving();
        console.error('[game-loading] Startup failed', error);

        status.textContent = '遊戲載入失敗，請檢查連線後重新載入。';

        notice.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.

      window.addEventListener('unhandledrejection', onUnhandledRejection);

          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {

          status.textContent = '正在載入點心島…';
          details.textContent = '正在準備載入資料…';

        const percent = Math.floor(loaded / total * 100);

        progress.value = loaded;

        status.textContent = current >= total
          ? '正在啟動遊戲…'
          : `正在下載遊戲資料・${percent}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);

      script.src = 'index.js';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
