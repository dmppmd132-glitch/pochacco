[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="localization/*.json,config/*.json,data/stages/*.json,assets/template/fonts/*-OFL.txt,assets/template/fonts/display/*-OFL.txt,assets/fonts/*-OFL.txt"
exclude_filter="dist/*,site/*,test/*,test-output/*,game-captures/*,__manus__/*,assets/fonts/SOURCES.md,assets/share/favicon-32.png,assets/share/loader-icon-96.png,assets/share/og-cover.png,assets/share/pwa-icon-144.png,assets/share/pwa-icon-180.png,assets/share/pwa-icon-512-optimized.png,assets/share/pwa-icon-512.png,assets/snackisle/dudu.png,assets/snackisle/pochacco.png"
export_path="dist/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/loading.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/offline_page="res://web/offline.html"
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://assets/share/pwa-icon-144.png"
progressive_web_app/icon_180x180="res://assets/share/pwa-icon-180.png"
progressive_web_app/icon_512x512="res://assets/share/pwa-icon-512-optimized.png"
progressive_web_app/background_color=Color(1, 0.956, 0.933, 1)
